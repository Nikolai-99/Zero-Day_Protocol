[project]
name = "zero-day-protocol"
version = "1.0.0"
description = "Zero-Day Protocol - Cyberpunk 3D Tactical Combat Game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pyrefly>=0.1.0",
    "httpx>=0.27.0",
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*starlette.*:Warning",
]

[tool.pyrefly]
search-path = ["."]
project-includes = [
    "backend/**/*.py",
    "tests/**/*.py",
]
